# Security headers that every response of this host must carry.
#
# Kept in a snippet rather than typed once in the `server` block because of
# an nginx rule that bites silently: `add_header` in a `location` REPLACES
# the whole inherited set instead of adding to it. Every location here that
# declares its own `Cache-Control` (`/assets/`, the static-file regex,
# `/api/globe`, `/s/`, `/u/`, `/j/`, the Apple site association) was
# therefore served with NO `nosniff`, NO `Referrer-Policy` and NO CSP — and
# nothing said so. `include`ing this file next to each of those is the only
# form nginx offers that cannot drift.
#
# Content-Security-Policy is NOT here: it lives in `nginx-csp.conf`, because
# the three locations proxied to the backend (`/s/`, `/u/`, `/j/`) carry the
# backend's own, stricter `default-src 'none'` policy and a second CSP header
# would only be intersected with it — confusing to read and impossible to
# reason about when one of the two changes.

# Никаких догадок о типе: JSON-ответ /api/globe и .well-known без этого
# браузер волен «угадать» как HTML и исполнить.
add_header X-Content-Type-Options "nosniff" always;

# Путь /app/trips/<uuid> — это идентификатор поездки. `strict-origin-…`
# оставляет сторонним хостам (тайлы OpenFreeMap, CDN Apple) только
# «https://trip-track.app», без пути. Без этого id поездки уезжал бы в
# Referer чужому серверу на каждом тайле карты.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Кликджекинг: «Мои поездки» — экран со списком личных поездок и кнопкой
# выхода. DENY, а не SAMEORIGIN: сам сайт себя нигде не встраивает, а
# `frame-ancestors 'none'` в CSP говорит то же современным браузерам.
add_header X-Frame-Options "DENY" always;

# Ни одна страница сайта не просит ни геолокацию, ни камеру, ни микрофон, ни
# платежи (карта рисует ЧУЖОЙ трек, а не «где вы сейчас»). Выключено явно,
# чтобы внедрённый скрипт не мог их попросить и от нашего имени.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# HSTS без `includeSubDomains` СОЗНАТЕЛЬНО: поддомены (api., analytics.)
# живут своей жизнью, и решение за всё дерево принимается в панели
# Cloudflare, а не здесь — см. docs/web-app-security.md, список владельца.
add_header Strict-Transport-Security "max-age=31536000" always;
