# Copied to /etc/nginx/conf.d/00-globe-cache.conf (included inside http{} by the
# base image; the 00- prefix sorts it before default.conf so the zone exists when
# the server block parses). proxy_cache_path is http-context only.
proxy_cache_path /var/cache/nginx/globe levels=1:2 keys_zone=globe_cache:1m
                 max_size=64m inactive=60m use_temp_path=off;
limit_req_zone $binary_remote_addr zone=globe_rl:1m rate=30r/s;
