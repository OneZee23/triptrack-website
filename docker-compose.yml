services:
  triptrack-web:
    # Image is built by the GitHub Actions runner and pushed to GHCR on
    # every commit to master. VPS pulls a ready-made image instead of
    # compiling locally — the previous on-VPS `npm ci + tsc + vite` flow
    # was timing out at 30m because of memory pressure from the umami /
    # postgres / nginx co-tenants.
    image: ghcr.io/onezee23/triptrack-website:latest
    pull_policy: always
    ports:
      - "127.0.0.1:3080:8080"
    restart: unless-stopped

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_SECRET}
    depends_on:
      umami-db:
        condition: service_healthy
    restart: unless-stopped

  umami-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  umami-data:
