# Content-Security-Policy for pages this host serves itself.
#
# ЗАЧЕМ ОНА ЗДЕСЬ ГЛАВНАЯ: в `localStorage` под ключом `tt.app.session`
# лежат access- и refresh-токен аккаунта (`src/app/storage.ts`). Любой
# скрипт, исполнившийся на этом origin, читает их целиком и уносит вместе с
# доступом ко всем поездкам человека. CSP — единственное, что стоит между
# «нашлась XSS» и «увели аккаунт».
#
# Каждый источник ниже — реальный запрос из кода, а не запас на будущее;
# `nginx.spec.ts` сверяет этот список с хостами, которые встречаются в
# `src/` и `index.html`, и падает, если появился новый или исчез старый.
#
#   script-src  'self'                          — собственные чанки Vite
#               analytics.trip-track.app        — Umami (index.html)
#               appleid.cdn-apple.com           — SDK входа (src/app/appleSdk.ts),
#                                                 грузится только на /app/login
#   connect-src api.trip-track.app              — ВЕСЬ раздел «Мои поездки»
#                                                 (src/app/api.ts:19); без него
#                                                 /app не работает вовсе
#               analytics.trip-track.app        — отправка просмотров Umami
#               tiles.openfreemap.org           — стиль и тайлы MapLibre
#               appleid.apple.com               — обмен с попапом входа
#               'self'                          — /api/globe (прокси на бэкенд)
#   img-src     data: blob:                     — тайлы MapLibre рисуются в canvas
#   worker-src / child-src blob:                — воркеры MapLibre
#   frame-src   appleid.apple.com               — окно Sign in with Apple
#   style-src   'unsafe-inline'                 — НУЖНО: React расставляет
#                                                 style="..." прямо в разметке
#                                                 (TripMap.tsx:99 и далее), а
#                                                 style-src-attr наследует
#                                                 style-src. Убрать можно
#                                                 только вместе с инлайновыми
#                                                 стилями, не раньше.
#   frame-ancestors 'none'                      — список личных поездок нельзя
#                                                 положить в чужой iframe
#   form-action 'self'                          — внедрённая форма не сможет
#                                                 отправить токен на свой хост
#   object-src 'none', base-uri 'self'          — классика: ни плагинов, ни
#                                                 подмены базового адреса
#
# JSON-LD (<script type="application/ld+json">, scripts/prerender.mjs) под
# `script-src 'self'` живёт: браузер такой блок не исполняет, значит и не
# «готовит к исполнению», значит CSP его не проверяет.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://analytics.trip-track.app https://appleid.cdn-apple.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://api.trip-track.app https://analytics.trip-track.app https://tiles.openfreemap.org https://appleid.apple.com; frame-src https://appleid.apple.com; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
