<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f6f2" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- One variable file carries every weight the site uses, and every page
         paints a bold heading in the first frame, so it is worth fetching
         before the stylesheet asks for it. The Cyrillic subset is NOT
         preloaded here: this template serves both languages, and an English
         page would download a face it has no character for. `/ru/` pages get
         their own preload from scripts/prerender.mjs. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Title, description, canonical, hreflang, Open Graph and JSON-LD are
         written per page and per language by scripts/prerender.mjs. This file
         is the template AND the SPA fallback, so it keeps a plain default
         head; nothing here is what a crawler reads on a real page. -->
    <!--app-head-->
    <title>TripTrack — drive diary and trip tracker for iPhone</title>
    <meta name="description" content="A trip tracker for iPhone that records every drive by itself and keeps it as a drive diary: route, photos, stats, places and a fog of war map you uncover." />
    <!--/app-head-->

    <!-- Analytics — Umami (cookieless, self-hosted) -->
    <script defer src="https://analytics.trip-track.app/script.js" data-website-id="1e458188-3307-4fb1-b14f-2620e0d4f5ae"></script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
