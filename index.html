<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f6f2" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The display face: every page paints a bold heading in the first frame,
         so it is worth fetching before the stylesheet asks for it. The other
         weights are not preloaded on purpose — they would compete with it. -->
    <link rel="preload" href="/fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Title, description, canonical, hreflang, Open Graph and JSON-LD are
         written per page and per language by scripts/prerender.mjs. This file
         is the template AND the SPA fallback, so it keeps a plain default
         head; nothing here is what a crawler reads on a real page. -->
    <!--app-head-->
    <title>TripTrack — drive diary and trip tracker for iPhone</title>
    <meta name="description" content="A trip tracker for iPhone that records every drive by itself and keeps it as a drive diary: route, photos, stats, places and a fog of war map you uncover." />
    <!--/app-head-->

    <!-- Analytics — Umami (cookieless, self-hosted).

         `data-auto-track="false"` — не настройка вкуса, а единственное
         место, где закрывается утечка: с автотреком Umami сам отправляет
         ПУТЬ страницы, а в разделе «Мои поездки» путь — это
         `/app/trips/<uuid>`, то есть идентификатор личной поездки на
         сервере аналитики. Флаг `umami.disabled` из `src/app/analytics.ts`
         эту дыру закрыть не мог: тег отложенный, но он исполняется РАНЬШЕ
         нашего кода, и самый первый заход по ссылке на поездку уезжал
         целиком.

         Просмотры маркетинговых страниц шлёт теперь `trackPageView()`
         (`src/lib/analytics.ts`), которую зовёт `AppLayout` на каждой
         смене адреса и которая молчит на всём, что начинается с `/app`. -->
    <script defer src="https://analytics.trip-track.app/script.js" data-website-id="1e458188-3307-4fb1-b14f-2620e0d4f5ae" data-auto-track="false"></script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
