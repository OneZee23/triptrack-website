server {
    listen 8080;
    server_name trip-track.app www.trip-track.app;
    root /usr/share/nginx/html;
    index index.html;

    # Prerendered pages first, SPA shell last.
    #
    # Every marketing route ships as a real file — `/features` is
    # `features/index.html`, `/ru/features` is `ru/features/index.html` — so a
    # crawler and a cold visitor get finished HTML with the right <title> and
    # <html lang> instead of an empty <div id="root">.
    #
    # The final fallback stays `/index.html` (which is also the prerendered
    # English home page) because the signed-in `/app` area is deliberately NOT
    # prerendered and has to reach the client router. The cost is that a
    # mistyped marketing URL answers 200 with the home page's markup and then
    # client-routes to the 404 screen; making that a hard 404 means giving
    # `/app` its own location, which belongs to whoever owns that area.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # A real 404 for anything that reaches nginx with no file behind it —
    # a stale asset URL after a deploy, for instance. `404.html` is the same
    # branded page the app renders, prerendered in English (it answers at every
    # wrong address at once, so it cannot belong to one language).
    error_page 404 /404.html;
    location = /404.html {
        # No add_header here on purpose: an add_header in a location replaces
        # the inherited set, and this page wants the site-wide security and
        # no-cache headers declared at the bottom of this file.
        internal;
    }

    # Hashed build output: the name changes whenever the bytes do, so it can be
    # cached forever. Declared with ^~ so it wins over the extension regex
    # below and this header is the one that applies.
    location ^~ /assets/ {
        try_files $uri @previous_assets;
        error_page 404 = @asset_not_found;
        # `include` перед add_header — не украшение: собственный add_header
        # здесь СТИРАЕТ весь набор, унаследованный от server (см. шапку
        # snippets/headers.conf). Без этих двух строк бандл приложения
        # отдавался бы без `nosniff`.
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # An already-open tab can request a lazy chunk from the previous release.
    # Only hashed public assets are retained; HTML always comes from this image.
    location @previous_assets {
        root /var/lib/triptrack-asset-history;
        try_files $uri =404;
        error_page 404 = @asset_not_found;
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Do not cache a missing JavaScript URL (or return the branded HTML page
    # as a script). A transient miss must remain recoverable after deployment.
    location @asset_not_found {
        types { }
        default_type text/plain;
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "no-store" always;
        return 404 "Asset not found\n";
    }

    # Reverse-proxy + 5-min micro-cache for the public globe data
    location = /api/globe {
        limit_except GET { deny all; }
        limit_req zone=globe_rl burst=60 nodelay;
        proxy_set_header Cookie "";

        proxy_pass https://api.trip-track.app/public/map;
        proxy_set_header Host api.trip-track.app;
        proxy_ssl_server_name on;
        proxy_ssl_name api.trip-track.app;
        proxy_http_version 1.1;

        proxy_cache globe_cache;
        proxy_cache_key $scheme$proxy_host$uri$http_accept_encoding;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 10s;
        proxy_ignore_headers Set-Cookie Cache-Control Expires X-Accel-Expires;
        proxy_hide_header Set-Cookie;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;

        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=60";
    }

    # Reverse-proxy shared-trip landing pages to the backend. The share URL handed
    # to users is trip-track.app/s/<code> (backend social.service builds it), but
    # the page that renders it lives in the backend's ShareController — so this
    # host must forward /s/* there, or React Router serves its 404 error shell.
    # Mirrors the /api/globe proxy above.
    location /s/ {
        proxy_set_header Cookie "";

        proxy_pass https://api.trip-track.app/s/;
        proxy_set_header Host api.trip-track.app;
        proxy_ssl_server_name on;
        proxy_ssl_name api.trip-track.app;
        proxy_http_version 1.1;

        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;

        # CSP сюда НЕ включается: бэкенд ставит на этой странице свою, более
        # строгую (`default-src 'none'`), и вторая только пересекалась бы с
        # ней. Всё остальное — nosniff, Referrer-Policy, Permissions-Policy —
        # он не ставит, и без include страница жила бы вовсе без них.
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Shared PROFILE links, same arrangement as /s/ above. The app hands out
    # trip-track.app/u/<account-id>; the page behind it is the backend's
    # ProfilePageController. Without this the SPA answered every profile link
    # with the marketing home page — a 200 showing the wrong thing, which is
    # worse than a 404.
    location /u/ {
        proxy_set_header Cookie "";

        proxy_pass https://api.trip-track.app/u/;
        proxy_set_header Host api.trip-track.app;
        # The backend picks the page language off this header.
        proxy_set_header Accept-Language $http_accept_language;
        proxy_ssl_server_name on;
        proxy_ssl_name api.trip-track.app;
        proxy_http_version 1.1;

        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;

        # См. /s/ выше: свою CSP страница получает от бэкенда.
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Shared JOURNEY links (0.6.8), same arrangement as /s/ and /u/. The app
    # hands out trip-track.app/j/<code>; the page behind it is the backend's
    # JourneyShareController (same share-html as /s/). Until this block is
    # deployed the edge Cloudflare Origin Rule «/j/* → api» covers it.
    location /j/ {
        proxy_set_header Cookie "";

        proxy_pass https://api.trip-track.app/j/;
        proxy_set_header Host api.trip-track.app;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_ssl_server_name on;
        proxy_ssl_name api.trip-track.app;
        proxy_http_version 1.1;

        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;

        # См. /s/ выше: свою CSP страница получает от бэкенда.
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Universal links. iOS fetches this file (unsigned, iOS 9.3+) to learn
    # which app owns which paths on this host — it MUST come back as JSON, and
    # nginx would otherwise type an extension-less file as octet-stream and
    # the association would silently never form.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|webp|avif|gif|ico|svg|woff2)$ {
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/csp.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers. Оба файла — в snippets/, не в conf.d/: всё, что
    # лежит в conf.d, базовый образ подключает сам внутрь http{}, и файл
    # с add_header подключился бы ДВАЖДЫ — здесь и там.
    #
    # Прежняя CSP, стоявшая тут одной строкой, ЛОМАЛА раздел «Мои поездки»
    # целиком: в `connect-src` не было `https://api.trip-track.app`, то есть
    # ни списка поездок, ни входа, — а в `script-src` не было
    # `https://appleid.cdn-apple.com`, то есть SDK Apple не загружался вовсе.
    include /etc/nginx/snippets/headers.conf;
    include /etc/nginx/snippets/csp.conf;

    # The SPA shell (index.html, served by `location /`) must NEVER be cached long:
    # it references hashed /assets/* files that change every deploy, so a stale
    # shell 404s every asset. The assets + /api/globe locations set their own
    # Cache-Control, so this only affects index.html. (Cloudflare also caches the
    # shell — purge it once, and it should respect this no-cache going forward.)
    add_header Cache-Control "no-cache, must-revalidate" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
}
