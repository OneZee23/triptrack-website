name: Deploy to VPS

on:
  push:
    branches: [master]

# Build the Docker image on the GitHub-hosted runner (fast network,
# plenty of RAM, persistent buildx cache via type=gha), push to ghcr.io,
# then SSH into the VPS only to `docker pull` and restart. The previous
# "build on VPS" flow was timing out at 30m because `tsc -b && vite
# build` ran out of memory while Postgres / Umami / nginx competed for
# the same 1-2GB box. Moving the build off the VPS makes deploy finish
# in seconds regardless of how heavy the website toolchain becomes.

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # `:latest` is what the compose file references for routine
          # restarts; the SHA tag is for rollback investigation ("which
          # commit is in production right now?") via `docker image ls`.
          tags: |
            ghcr.io/onezee23/triptrack-website:latest
            ghcr.io/onezee23/triptrack-website:${{ github.sha }}
          # GitHub Actions cache reuses npm ci / Vite build layers
          # between runs — first build after a package-lock bump is
          # still slow, but routine content commits push in ~30-60s
          # instead of 6-10 minutes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # The VPS cannot fetch layers from ghcr.io. Three deploys in a row died
      # here (17 Aug, 22 Aug, 3 Sep) with `exit 124` after ~15 minutes of every
      # layer sitting at «Pulling fs layer 0B» — zero bytes, not slow bytes.
      # The manifest arrives, so ghcr.io itself resolves; the blobs come from
      # pkg-containers.githubusercontent.com, and that host is what never
      # answers. `git pull` from github.com on the same box finishes in three
      # seconds, so the machine's network is fine — one host is not.
      #
      # So the image travels over the SSH channel that demonstrably works
      # instead of over a registry fetch that does not. The runner pulls (fast,
      # GitHub's own network), saves, and ships the tarball to the VPS, which
      # loads it locally. `docker compose pull` is gone from the VPS script
      # entirely — that command is the failure.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image on the runner and pack it
        run: |
          set -e
          docker pull ghcr.io/onezee23/triptrack-website:latest
          # gzip -1: the tarball crosses one SSH hop and is deleted minutes
          # later, so transfer time matters and ratio does not.
          docker save ghcr.io/onezee23/triptrack-website:latest | gzip -1 > image.tar.gz
          ls -lh image.tar.gz

      # Plain OpenSSH rather than scp-action, for two measured reasons.
      #
      # First, scp-action tars whatever you hand it — so it spent 110 seconds
      # re-packing an already-gzipped tarball into a second tarball before
      # sending a byte.
      #
      # Second, and the reason it failed: its Go SSH client got «handshake
      # failed: connection reset by peer» from this host. Streaming straight
      # into `docker load` needs no temp file on either side, uses the same
      # OpenSSH client the rest of the world talks to this box with, and is one
      # connection instead of two.
      #
      # Retried three times with a pause: a reset handshake is the symptom of a
      # box refusing a connection at that moment, not of a wrong key — and the
      # loop is bounded so a genuinely broken key still fails the job loudly.
      - name: Stream the image into docker load
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=15"
          for attempt in 1 2 3; do
            echo "--- попытка $attempt: заливаю образ в docker load ---"
            if $SSH "$VPS_USER@$VPS_HOST" 'gunzip -c | docker load' < image.tar.gz; then
              echo "образ загружен на VPS"
              exit 0
            fi
            echo "попытка $attempt не удалась"
            sleep 20
          done
          echo "не удалось передать образ за три попытки"
          exit 1

      - name: Load + restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The registry fetch is gone, and with it the only step that ever ate
          # this budget. What is left — git pull, docker load from a local
          # tarball, restart — is seconds. 10m is now head-room, not hope: if
          # this timeout is ever hit again it means something genuinely hung,
          # which is exactly what a timeout should mean.
          command_timeout: 10m
          script: |
            set -e

            # Every step announces itself with a timestamp, and every long
            # command carries its own `timeout`. Three deploys in a row died on
            # «Run Command Timeout» with no output at all, which told us the
            # budget ran out but not WHICH command ate it — the log has to name
            # the culprit itself, or diagnosing means guessing.
            step() { echo "--- $(date -u +%H:%M:%S) $* ---"; }

            step "host state"
            df -h / | tail -1
            docker system df 2>&1 | tail -4 || true

            step "docker daemon alive?"
            # Cheap liveness probe with a hard cap. A hung dockerd blocks the
            # CLI on its socket BEFORE printing anything, which is exactly the
            # silence we kept seeing; this turns that into a named failure in
            # 30 seconds instead of a mute 15-minute timeout.
            timeout 30 docker version --format '{{.Server.Version}}'

            cd /opt/triptrack-website
            # `git pull` keeps the on-VPS docker-compose.yml current so
            # changes to service definitions (umami, postgres, env)
            # land alongside the image bump. Source code itself is
            # baked into the pulled image — VPS never compiles anything.
            #
            # Retried once: on 15 Aug this line died with «Could not resolve
            # host: github.com» after three minutes of resolver timeouts, and
            # the droplet's DNS was working again by the time anyone looked.
            # DigitalOcean's resolvers (67.207.67.2/.3) blinked. One retry
            # turns that into a slow deploy instead of a red build and a
            # production still serving the previous image.
            #
            # It is deliberately ONE retry, not a loop: a resolver that is
            # genuinely down should still fail the job loudly rather than be
            # papered over for ten minutes.
            git pull origin master || {
              echo "git pull failed — retrying once in 15s"
              sleep 15
              git pull origin master
            }
            step "image is already loaded — confirm it is here"
            # No `docker compose pull` here on purpose: that command is the
            # failure this whole change removes. The previous step streamed the
            # image straight into `docker load` over SSH, and it carries the
            # exact tag the compose file references, so `up -d` finds it
            # locally and never reaches for a registry.
            timeout 60 docker image inspect ghcr.io/onezee23/triptrack-website:latest \
              --format 'загружен: {{.Id}} ({{.Created}})'
            # `--no-deps triptrack-web`, not a bare `up -d`: the bare form also
            # brings up umami, which `depends_on` postgres `service_healthy`, so
            # a website deploy sat waiting on the analytics database's health
            # check. The website does not need umami to ship, and umami does not
            # need redeploying when only the site changes. Touch the analytics
            # stack by hand when its own config moves.
            step "restart container"
            timeout 180 docker compose up -d --no-deps triptrack-web
            # Prune dangling images so the VPS disk doesn't slowly fill
            # with old layers.
            step "prune dangling images"
            # This is the LAST step, so a deploy that fails earlier never runs
            # it — three failed deploys in a row meant three rounds of old
            # layers left on a small disk. That is why `df -h` now runs first.
            timeout 120 docker image prune -f

            # Fail loudly if the running container is NOT the image we just
            # pulled. On 14 Aug the job timed out after the pull but before the
            # restart: CI went red, production quietly kept serving the old
            # build, and the two facts looked unrelated for a day. A red job
            # must mean "not deployed", and a green one must mean "deployed".
            step "verify"
            running=$(docker inspect --format '{{.Image}}' "$(docker compose ps -q triptrack-web)")
            latest=$(docker image inspect --format '{{.Id}}' ghcr.io/onezee23/triptrack-website:latest)
            if [ "$running" != "$latest" ]; then
              echo "Container is still on $running, expected $latest"
              exit 1
            fi
            echo "Deployed at $(date)"
